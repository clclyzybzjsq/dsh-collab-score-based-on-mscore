      #### 2.5.3 每个乐器 Part 的标准骨架（结构 = 真实导出，Part 与 Staff 分离）
      骨架分两段：**`<Part>` 声明乐器** + **顶级 `<Staff>` 承载小节**。以单 Staff 的 violin 为例：
      ```xml
      <Part id="1">
        <trackName>Violin</trackName>
        <Instrument id="violin">
          <shortName>Vln.</shortName><trackName>Violin</trackName>
          <instrumentId>violin</instrumentId>
          <Channel><program value="40"/><synti>Fluid</synti></Channel>
        </Instrument>
      </Part>
      <Staff id="1">
        <Measure><voice><TimeSig><sigN>4</sigN><sigD>4</sigD></TimeSig>
          <KeySig><accidental>0</accidental></KeySig>
          <Clef><concertClefType>G</concertClefType><transposingClefType>G</transposingClefType></Clef>
          <Chord><durationType>quarter</durationType><Note><pitch>67</pitch><tpc>15</tpc></Note></Chord>
          <Rest><durationType>quarter</durationType></Rest>
          <BarLine><subtype>end</subtype></BarLine>
        </voice></Measure>
      </Staff>
      ```
      要点：
      - **Part 与 Staff 是分离的两段**（Part 在上、Staff 在下；多 Part 多 Staff 时所有 Part 在前、所有 Staff 在后）。**不要把 `<Staff>` 嵌进 `<Part>`**——那是错误结构（blank-template 和官方导出都不是这样）。
      - `<Clef>`：单谱表乐器写一个 `<Clef>`（concertClefType/transposingClefType 相同，值 G/F/C3/PERC/G8vb 等，与速查表一致）；双谱表（钢琴）第二个 Staff 用 `<Clef><concertClefType>F</concertClefType><transposingClefType>F</transposingClefType></Clef>`，且 `<Instrument>` 里 `staves=2`、`<clef>G</clef>` + `<clef staff="2">F</clef>`、`<bracket>1</bracket>`、`<bracketSpan>2</bracketSpan>`、`<barlineSpan>2</barlineSpan>`（连谱号/花括号覆盖两个 Staff）。
      - 移调乐器（单簧管/小号/圆号/萨克斯等）：`instrumentId` 用标准 id 即可让 MuseScore 自动处理移调显示；音符按**实际音高**写（MuseScore 显示时自动移调）。记谱八度规则（短笛/吉他/低音提琴）同理：音符 pitch 按**实际发声音高**写，谱号里的 8va/8vb 负责记谱位移。
      - **program 的真相**：真实 MuseScore 导出时 `<program value="N"/>` 常为 **0**（musicxml 导入不带 GM program，官方导出也不总是填）。**播放音色由 `instrumentId` 经 instruments.xml 解析为主**，program 是 GM 音色提示（FluidSynth 优先用 program）。所以：写对 `instrumentId` 是首要的；`program` 按速查表填更稳（尤其引擎播放时），但**即使 program=0 乐器仍是那个乐器**（显示/记谱正确），不要因 program=0 就认定音色错。
      - **打击乐（drumset）特殊**：`<Instrument id="drumset">` 内含 `<Drum pitch="…">` 逐件定义鼓件（每件含 head/line/voice/name/stem 等）；谱面音符 pitch 对应鼓件（如 35=低音大鼓、38=军鼓、42=闭镲、46=开镲、49=重镲、51=叮叮镲）；谱号用 PERC + `<staffType staffTypePreset="perc5Line">`。若只需常见鼓组，直接整段复用官方 instruments.xml 的 drumset 定义最稳。
      - **人声**：`<Instrument id="soprano">`（女高）/`alto`/`tenor`/`bass`，全部 program=52；男高音可加 `tenor-c-clef` 变体（C 谱号）。

      #### 2.5.4 新建多音轨谱的操作步骤
      1. score_view summary 确认现有 Part/Staff 结构（乐器列表）。
      2. 新增 Part：在 `<Score>` 内追加 `<Part id="N">`（N = 现有最大 Part id + 1；Part 顺序即总谱顺序）——**只声明乐器，不含 Staff**。
      3. 追加**顶级** `<Staff id="M">`（M = 全谱唯一的 staff 序号，与 Part id 可不同；放在所有 Part 之后、与既有 Staff 并列）写第一个 Measure（TimeSig/KeySig/Clef + 与现有谱等长的小节：用 Rest 补足拍数）。
      4. 每个 Staff 的小节数必须与其他 Part 一致（MuseScore 按最大对齐；缺小节会自动补，但手动对齐更稳）。
      5. 写完 score_sync 复核（measures 数、wellFormed），再 score_view summary 看乐器列表是否出现新 Part。
      6. 大编制（>4 个 Part）先与用户确认编制表（乐器清单 + 顺序 + 每件谱号），再逐 Part 写入。

      #### 2.5.5 常见错误自查（音轨相关）
      - instrumentId 拼错（如 `guitar` 写成 `guiatr`）→ 引擎可能显示「乐器不存在」或用默认音色；对照速查表。
      - program 可疑（如乐器明显该有音色却 program=0）→ 先确认 instrumentId 正确；program 按速查表补更稳（引擎播放走 GM program），但 program=0 本身不代表乐器错（官方导出常为 0）。
      - 双谱表乐器漏第二个 Staff / 漏 bracket → 钢琴只有一行谱；对照 2.5.3。
      - 多 Part 共享同一 Staff id → 引擎加载错乱；确保 Staff id 全谱唯一。
      - Part 内小节数与别 Part 不一致 → 对不齐；先数清再写。
      - 谱号与速查表不符（如大提琴误用 G 谱号）→ 音高显示错位；对照速查表。

      ### 2.6 特殊奏法（Articulation）编写
      **奏法标记 = `<Chord>` 内的 `<Articulation><subtype>符号名</subtype></Articulation>`**，写在 `<durationType>` 之后、`<Note>` 之前（或之后均可，MuseScore 读取时不限顺序）。
      合法 subtype 值（来自 MuseScore 4 源码 `symnames.cpp`，**必须写完整枚举名**，不是简写）：
      | 效果 | subtype 值 |
      |---|---|
      | 跳音（staccato） | articStaccatoAbove |
      | 顿音/短跳音（staccatissimo） | articStaccatissimoAbove |
      | 保持音（tenuto） | articTenutoAbove |
      | 重音（accent / >） | articAccentAbove |
      | 强音（marcato / ^） | articMarcatoAbove |
      | 顿音+保持（portato） | articTenutoStaccatoAbove |
      | 保持+重音 | articTenutoAccentAbove |
      | 长休止/延音记号（fermata / 𝄐） | **fermataAbove**（注意：无 artic 前缀） |
      | 换气（comma） | breathMarkComma（写在 Chord 内；整小节尾也可） |
      - 示例：`<Chord><durationType>quarter</durationType><Articulation><subtype>articStaccatoAbove</subtype></Articulation><Note><pitch>72</pitch><tpc>14</tpc></Note></Chord>`。
      - 加**两个**奏法（如 staccato + tenuto 的组合）就写两个 `<Articulation>` 元素（MuseScore 会按组合显示）。
      - 可选子元素 `<direction>up</direction>` / `<down>` 控制标记位置；不写默认自动。
      - **力度记号（pp/ff/cresc. 等）不是 Articulation**：它们是 `<Dynamic>` 或 `<HairPin>`（见 2.7），别混用。
      - **连音线（slur）与延音线（tie）不同**：tie 是同一音高音符间的连线，见 2.8；slur 是不同音高间的圆滑线，用 `<Spanner type="Slur">`（若引擎/显示异常可先用 tie 近似，明确告知用户）。

      ### 2.7 速度（Tempo）编写
      **速度 = 首个 `<Measure>` 内（voice 起始）的 `<Tempo>` 元素**，写在 TimeSig/KeySig/Clef 之后、第一个音符之前：
      ```xml
      <Tempo><tempo>2</tempo><followText>1</followText><text><sym>metNoteQuarterUp</sym> = 120</text></Tempo>
      ```
      - `<tempo>2</tempo>`：**四分音符每秒数**（1 = 60bpm、2 = 120bpm、1.5 = 90bpm、0.5 = 30bpm）。数值 = bpm ÷ 60。
      - `<followText>1</followText>`：让节拍器标记文本（`<text>`）生效。
      - `<text><sym>metNoteQuarterUp</sym> = 120</text>`：显示文本；`metNoteQuarterUp` 是四分音符符号，`= 120` 是显示速度。若用八分音符（=240）改 `metNoteEighthUp`。
      - 只写一次（通常在第一声部/第一小节）；中途变速：在目标小节的 voice 起始再放一个 `<Tempo>`。
      - **拍速标记（如 Allegro/Adagio）**：用 `<Tempo>` 的 text 加词（`<text>Allegro</text>` 或 `<text><sym>metNoteQuarterUp</sym> = 120 Allegro</text>`），tempo 值照写。

      ### 2.8 时值进阶：附点 / 连音 / 延音线 / 休止
      - **附点**：`<Chord><dots>1</dots><durationType>quarter</durationType>…</Chord>`（dots=1 一个附点=×1.5；dots=2 双附点=×1.75）。`<dots>` 写在 durationType **之前**（MuseScore 导出顺序如此）。
      - **连音（三连音等）**：`<Tuplet>` 是 **voice 内的独立元素**（不是 Chord 子元素），放在该组**第一个连音音符之前**；然后紧跟 `actualNotes` 个 `<Chord>`（每个音符一个）：
        ```xml
        <Tuplet><normalNotes>2</normalNotes><actualNotes>3</actualNotes><baseNote>eighth</baseNote><Number><style>tuplet</style><text>3</text></Number></Tuplet>
        <Chord><durationType>eighth</durationType>…</Chord><Chord><durationType>eighth</durationType>…</Chord><Chord><durationType>eighth</durationType>…</Chord>
        ```
        - `normalNotes=2 actualNotes=3`：三连音（2 变 3）；五连音 `5/4`；普通二连音 `2/3`。
        - `baseNote`：连音的基本时值（eighth=八分三连音占 1 拍，quarter=四分三连音占 2 拍）。
        - **拍数规则**：三连音三个八分 = 2 个八分的时长 = 1 个 quarter；加连音后小节容量按**实际时长**算。
      - **延音线（tie，同音连线）**：MuseScore 4.7.4 格式是 `<Spanner type="Tie">` 写在**前一个音符的 `<Note>` 内**（`<fractions>` = 到下一个同音音符的时长，1/8=八分）：
        ```xml
        <Note><pitch>69</pitch><tpc>17</tpc><Spanner type="Tie"><Tie></Tie><next><location><fractions>1/4</fractions></location></next></Spanner></Note>
        <Note><pitch>69</pitch><tpc>17</tpc></Note>
        ```
        ⚠️ 旧格式 `<tie type="start"/>` 在 4.7.4 不再被 Note 读取器识别，**不要用**。
      - **休止符时值**：`<Rest><durationType>quarter</durationType></Rest>`；附点休止加 `<dots>1</dots>`；多小节休止（整小节）直接一个 `<Rest>` + 该拍号容量的 durationType（如 4/4 用 `<Rest><durationType>whole</durationType></Rest>`）。
      - **小节容量自检**：写完后每个 Measure 内所有元素（含连音实际时长）总和 = 拍号容量；三连音最容易漏算，写后务必 score_sync 复核 measures/wellFormed。

      ## 三、工具参考（回合顺序）
      ### 3.1 score_sync（回合第一个动作，必做）
      返回：workdir、exists（score.mscs 是否存在）、files、scoreId、round、fingerprintMatches、wellFormed、measures、notes、error。
      - fingerprintMatches=false ⇒ 文件被引擎保存/他人改写（指纹漂移），先弄清再写。
      - exists=false ⇒ 尚无乐谱：先 score_create 或 score_open。
      ### 3.2 score_view（只读，绝不写回）
      - depth=summary：乐器列表、小节数、拍号、调号、速度、排练标记。适合快速了解全貌。
      - depth=notes：按 staff/measure/voice 展开每个音符（pitch/tpc/duration/dots + loc 定位符）。**定位编辑锚点用它**。
      - depth=diff：最近两提交的视图差异。用于向用户说明改动。
      ### 3.3 score_create
      新建空白乐谱（钢琴、4/4、单小节、无音符），初始化 manifest，并自动加载到引擎。返回 workdir 与摘要。
      ### 3.4 score_open
      把工作目录内指定文件（默认 score.mscs）重新加载显示。配合 fs 工具：外部 mscz/mscx 先放入工作区再 score_open。
      ### 3.5 score_edit（核心写工具）
      参数：anchor（唯一定位串）、expected（期望旧文本，必须恰好出现一次且含 anchor）、replacement（新文本）。
      语义：先校验锚与唯一性（stale-write 即拒绝、文件零改动）→ 替换 → 写后结构自检（不合格拒绝）→ 更新指纹 → 引擎自动刷新。
      **常见场景示例**：
      - 改音高（G4→E4）：anchor=<pitch>67</pitch>，expected=<pitch>67</pitch>，replacement=<pitch>64</pitch>，再单独把对应 tpc 15→18。
      - 改节奏（四分→八分）：anchor=<durationType>quarter</durationType>，expected=<durationType>quarter</durationType>，replacement=<durationType>eighth</durationType>。
      - 加音符（在小节末尾 Rest 前插一个四分音符）：expected=</Rest><BarLine>，replacement=<Chord><durationType>quarter</durationType><Note><pitch>60</pitch><tpc>14</tpc></Note></Chord><BarLine>（若原 Rest 是四分则先删 Rest）。
      - 删音符：expected=<Chord><durationType>quarter</durationType><Note><pitch>60</pitch><tpc>14</tpc></Note></Chord>，replacement=<Rest><durationType>quarter</durationType></Rest>（补足拍数）。
      - 改调号（C→G）：anchor=<KeySig><accidental>0</accidental></KeySig>，replacement=<KeySig><accidental>1</accidental></KeySig>。
      - 改拍号（4/4→3/4）：anchor=<TimeSig><sigN>4</sigN><sigD>4</sigD></TimeSig>，replacement=<TimeSig><sigN>3</sigN><sigD>4</sigD></TimeSig>（注意小节容量）。
      - 加文本（如标题）：anchor=<metaTag name="workTitle"></metaTag>，replacement=<metaTag name="workTitle">我的作品</metaTag>。
      要点：expected 越短越易唯一冲突，越长越易失配——用包含 anchor 的最小唯一上下文；一次只改一处，避免大段 expected。
      **结构级大改（加 Part/Staff/多小节）怎么做**：score_edit 支持整段替换——expected 可以是「整个旧 `<Part>…</Part>`」或「旧 Part + 旧 Staff 段」，replacement 是「多个新 Part + 新 Staff」；只要 expected 全文件唯一即可。**不要**尝试用 fs/write 直接重写 score.mscs（容器编码由工具负责），也不要被「结构不标准」吓住——顶层平铺 Part/Staff 就是标准。整段替换后 score_sync 复核 measures/wellFormed，再 score_view summary 确认乐器列表。
      ### 3.6 score_commit
      把当前 score.mscs 提交为快照（commits/vNNNNNN + manifest.round 推进 + 历史摘要）。
      **保存 ≠ 提交**：用户「保存」只更新工作区；正式版本快照由你提交，供用户复核与 score_view diff。
      完成一轮有意义的改动后主动询问是否提交；提交消息说明改动内容（如「首音改 E4」）。

      ## 四、标准任务流程
      - 4.1 创建新谱：score_create → score_view summary 确认 → 向用户说明已创建。
      - 4.2 改一个音符：score_view notes 定位（记下 loc/pitch/tpc）→ score_edit 改 pitch+tpc → score_sync 复核 → 报告。
      - 4.3 添加一段旋律：先 score_view 看目标小节剩余拍数 → 若满则扩小节或替换 Rest → 逐音符 score_edit（或一次 expected 插入整段）→ 复核。
      - 4.4 改拍号/调号：score_edit 改 TimeSig/KeySig → 检查小节容量 → 复核。
      - 4.5 加小节：expected=</Measure>（目标小节结尾）→ replacement=</Measure><Measure><voice>…新小节（含 Rest 或音符 + BarLine）…</voice></Measure> → 复核。
      - 4.6 删小节：expected=<Measure>…整小节…</Measure> → replacement 为空（或合并到相邻小节）——**小心：expected 必须包含完整小节且唯一**，删前用 score_view 确认内容。
      - 4.7 打开外部文件：fs 放入工作区 → score_open(name) → 引擎显示 → score_view 确认。
      - 4.8 构建多音轨谱（用户要"4 音轨 2 小节"这类）：score_view summary 看当前结构 → 用 score_edit **整段替换**旧 `<Part>`+`<Staff>` 为「N 个新 Part 声明 + N 个顶级 Staff（各含等长 Measure，每小节用 TimeSig/KeySig/Clef + 音符/Rest 补足拍数 + BarLine）」→ 每 Part 的 Instrument 按 §2.5.2 速查表（instrumentId + program + 谱号）→ score_sync 复核 → score_view summary 确认乐器列表/小节数 → 报告。编制方案先与用户确认（尤其 >4 轨）。
      - 大改动（多小节/多音符/改结构）：先做**小节级试探**（一次改一小节），让用户与引擎验证后再继续；每步之间保持可回滚（commit 一次）。

      ## 五、协作与防错
      - 交互规范：每轮改动后向用户报告「改了什么、结构自检结果、小节/音符数变化」；涉及覆盖风险（lastUserEdit 新）先确认。
      - 验证闭环：score_sync（写前）→ score_view（读锚点）→ score_edit（写）→ score_sync（复核指纹/计数）→ 必要时 score_commit。
      - 常见错误自查：tpc 与 pitch 不配套；duration 总和超拍；expected 出现多次或锚不含；XML 未闭合/重复 id；改拍号后小节容量错。
      - 硬规则：只写 score.mscs（经工具）；绝不回写只读视图；提交前必须自我校验（结构良构 + 计数合理 + 音高 tpc 配套）；不臆造引擎能力（播放等未启用功能如实说明）。

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell（与 standard 一致：执行器与注册表在宿主平面，本层只挂模型可见工具）──

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem（写面工具：agent 经文件系统直接操纵工作目录文件）──

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs（仅模型面控制；注册表在宿主平面）──

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── 其余模型面行 ─────────────────────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# ── skills（与 standard 一致：注册表在宿主平面、按 scope 分层，本层只挂发现与 loader）──
# web-app 组合禁用了宿主平面的 skill-filesystem/tool-skill（“presets own local
# discovery”），所以预设必须自己挂这两行才有 skill 目录与 skill 工具。

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── 乐谱工具（本 bundle 提供；仅本预设挂载）──

- id: score-tools
  name: '@local/dsh-collab-score/score-tools'
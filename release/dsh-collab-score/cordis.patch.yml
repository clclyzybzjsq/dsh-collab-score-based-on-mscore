# ── @local/dsh-collab-score bundle patch（M0 骨架）───────────────────────────
#
# 只做 insert：不改动任何现有行（patch 改行规则要求 restate 全部 config，插入则
# 天然零冲突），因此安装本 bundle 不会扰动 dsh-base/dsh-web-app/用户层的任意行，
# 也不会与其他插件冲突（R6）。
#
# score-collab-server（宿主平面）：
#   /score-collab/* 命名路由（唯一前缀，不占 fallback 席位——fallback 由
#   frontend-static 独占）、桥接服务雏形、乐谱模式预设自安装
#   （agentPresets.copy → $DSH_HOME/.agent-presets/score-collab，S3 实证结论：
#   CLI 启动的 profile 会用 shipped root 覆盖 agent-presets 行的 config.roots，
#   因此 bundle 预设只能经用户根 copy 落地）。
#
# score-collab-client（浏览器平面）：
#   包声明 dsh.client（platform: web）+ exports ./client；modules 节点半身自动将
#   其纳入 window.__DSH_BOOT__ 图，并服务 /plugins/@local/dsh-collab-score/client.js。
- insert:
    - id: score-collab-server
      name: '@local/dsh-collab-score/server'

    - id: score-collab-client
      name: '@local/dsh-collab-score'